name: Build and Push Docker Images

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  check-secrets:
    name: Validate Configuration
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - name: Check if secrets are set
        id: check
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "⚠️ DockerHub secrets not configured!"
            echo "Please add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to GitHub Secrets"
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              exit 1
            fi
          else
            echo "✅ DockerHub secrets configured"
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

  sanitize-branch:
    name: Sanitize Branch Name
    runs-on: ubuntu-latest
    outputs:
      branch_tag: ${{ steps.sanitize.outputs.branch_tag }}
    steps:
      - name: Get branch name
        id: sanitize
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | tr '/' '-')
          echo "branch_tag=$SAFE_BRANCH" >> $GITHUB_OUTPUT
          echo "Branch tag: $SAFE_BRANCH"

  build-backend:
    name: Build Backend
    needs: [check-secrets, sanitize-branch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ github.event_name != 'pull_request' && needs.check-secrets.outputs.has_secrets == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' && needs.check-secrets.outputs.has_secrets == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/p2p-backend:${{ needs.sanitize-branch.outputs.branch_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/p2p-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  build-frontend:
    name: Build Frontend
    needs: [check-secrets, sanitize-branch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ github.event_name != 'pull_request' && needs.check-secrets.outputs.has_secrets == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' && needs.check-secrets.outputs.has_secrets == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/p2p-frontend:${{ needs.sanitize-branch.outputs.branch_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/p2p-frontend:latest
          build-args: |
            VITE_API_BASE_URL=https://p2p-backend.onrender.com/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

