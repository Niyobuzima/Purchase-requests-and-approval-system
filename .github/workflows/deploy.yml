name: Deploy

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Upload project to server
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='venv' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            . ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/root/app

      - name: Create .env files on server
        run: |
          # Use <<- 'EOF' to allow indentation inside the SSH block
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} <<- 'EOF'
            
            # Use <<- 'EOV' to allow indentation inside the command substitution
            ENV_CONTENT=$(cat <<- 'EOV'
              DB_NAME=${{ secrets.DB_NAME }}
              DB_USER=${{ secrets.DB_USER }}
              DB_PASSWORD=${{ secrets.DB_PASSWORD }}
              DB_HOST=${{ secrets.DB_HOST }}
              DB_PORT=${{ secrets.DB_PORT }}
              ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
              VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
              DEBUG=False
            EOV
            )

            # Create .env for Backend
            echo "$ENV_CONTENT" > /root/app/backend/.env
            
            # Create .env for Frontend
            echo "$ENV_CONTENT" > /root/app/frontend/.env
            
          EOF # The closing EOF for the SSH session

      - name: Deploy Docker Compose stack
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/app
            docker compose -f docker-compose.prod.yml down --remove-orphans
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build
          EOF
