name: Deploy

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # Allows manual runs from the GitHub UI
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Ensures the workflow uses the environment secrets configured in GitHub
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🔑 Step 1: Securely Load SSH Private Key into the Agent
      # This is the industry-standard, secure way to handle private keys in CI/CD.
      # It removes the need for '-i ~/.ssh/theoserver_key' in subsequent steps.
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Assumes the private key is stored as a repository secret named SSH_PRIVATE_KEY
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 💻 Step 2: Add Remote Server to known_hosts
      # Prevents the non-interactive SSH prompt about host authenticity.
      - name: Add Server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 📤 Step 3: Upload Project to Server (rsync)
      # The '-e "ssh ..."' command is simplified since the key is now in the agent.
      - name: Upload project to server
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='venv' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            . ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/root/app
            
      # 📝 Step 4: Create .env on Server
      # The SSH command is now much cleaner without the explicit key file flag.
      # Variables are written to the remote file using a clean heredoc.
      - name: Create .env on server
        run: |
          # Use single quotes around the remote command to prevent local shell expansion
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} 'cat > /root/app/.env << EOF
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            DEBUG=False
            EOF'
            
      # 🐳 Step 5: Deploy Docker Compose stack
      # Executes all deployment commands in a single remote SSH session.
      - name: Deploy Docker Compose stack
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/app
            # Use 'docker compose' (no hyphen) for newer Docker versions
            docker compose -f docker-compose.prod.yml down --remove-orphans
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build
          EOF
