[project]
name = "p2p-backend"
version = "1.0.0"
description = "Procure-to-Pay System Backend"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2.16,<5.0",
    "djangorestframework>=3.14.0,<4.0",
    "djangorestframework-simplejwt>=5.3.0,<6.0",
    "psycopg2-binary>=2.9.9,<3.0",
    "django-cors-headers>=4.3.1,<5.0",
    "django-filter>=23.5,<24.0",
    "django-cloudinary-storage>=0.3.0,<1.0",
    "cloudinary>=1.36.0,<2.0",
    "python-dotenv>=1.0.0,<2.0",
    "openai>=1.6.1,<2.0",
    "pdfplumber>=0.10.3,<1.0",
    "pytesseract>=0.3.10,<1.0",
    "pillow>=10.1.0,<11.0",
    "reportlab>=4.0.7,<5.0",
    "weasyprint>=60.1,<61.0",
    "gunicorn>=21.2.0,<23.0",
    "uvicorn>=0.27.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3,<8.0",
    "pytest-django>=4.7.0,<5.0",
    "pytest-cov>=4.1.0,<5.0",
    "factory-boy>=3.3.0,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "backend"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db --nomigrations"

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*/migrations/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "backend"]
