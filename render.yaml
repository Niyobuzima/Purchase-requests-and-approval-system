services:
  # PostgreSQL Database
  - type: pserv
    name: p2p-database
    env: docker
    plan: starter  # Free tier
    region: oregon  # Choose your preferred region
    dockerfilePath: ./Dockerfile.render.db
    dockerContext: .
    envVars:
      - key: POSTGRES_DB
        value: p2p_db
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true  # Auto-generate secure password
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 1  # Free tier limit

  # Django Backend API
  - type: web
    name: p2p-backend
    env: docker
    plan: starter  # Free tier - will spin down after 15 min of inactivity
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DB_NAME
        value: p2p_db
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        fromDatabase:
          name: p2p-database
          property: password
      - key: DB_HOST
        fromDatabase:
          name: p2p-database
          property: host
      - key: DB_PORT
        fromDatabase:
          name: p2p-database
          property: port
      - key: DATABASE_URL
        fromDatabase:
          name: p2p-database
          property: connectionString
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: True
      - key: EMAIL_HOST_USER
        sync: false  # Set manually in Render dashboard
      - key: EMAIL_HOST_PASSWORD
        sync: false  # Set manually in Render dashboard
      - key: DEFAULT_FROM_EMAIL
        value: theophileniyobuzima@gmail.com
      - key: FRONTEND_URL
        value: https://p2p-frontend.onrender.com  # Update with actual frontend URL
      - key: CORS_ALLOWED_ORIGINS
        value: https://p2p-frontend.onrender.com,https://www.yourapp.com
    buildCommand: |
      pip install uv
      uv pip install --system -e .
    startCommand: |
      python manage.py migrate
      python manage.py collectstatic --noinput
      gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --worker-class gthread --worker-tmp-dir /dev/shm --timeout 120 --access-logfile - --error-logfile -

  # React Frontend
  - type: web
    name: p2p-frontend
    env: static
    plan: starter  # Free tier
    region: oregon
    buildCommand: |
      cd frontend
      npm ci
      npm run build
    staticPublishPath: ./frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: VITE_API_BASE_URL
        value: https://p2p-backend.onrender.com/api 