# Render Blueprint - Backend Only
# Frontend is deployed on Vercel
# Database: Use Render's managed PostgreSQL (create separately in dashboard)

databases:
  # Render Managed PostgreSQL
  - name: p2p-database
    plan: free  # Free tier: 1GB storage, expires after 90 days
    region: oregon
    databaseName: p2p_db
    user: p2p_user

services:
  # Django Backend API
  - type: web
    name: p2p-backend
    env: docker
    plan: free  # Free tier - spins down after 15 min of inactivity
    region: oregon
    # Use pre-built image from DockerHub
    image:
      url: docker.io/niyobuzima/procure-app:backend-latest
    healthCheckPath: /api/health/
    envVars:
      # Django Settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      # Database - from Render managed PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: p2p-database
          property: connectionString
      - key: DB_NAME
        fromDatabase:
          name: p2p-database
          property: database
      - key: DB_USER
        fromDatabase:
          name: p2p-database
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: p2p-database
          property: password
      - key: DB_HOST
        fromDatabase:
          name: p2p-database
          property: host
      - key: DB_PORT
        fromDatabase:
          name: p2p-database
          property: port

      # Cloudinary (set manually in dashboard)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # AI Configuration (set manually in dashboard)
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: AI_PROVIDER_PRIORITY
        value: "openai,gemini"

      # Email Configuration
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false  # Set manually in dashboard
      - key: EMAIL_HOST_PASSWORD
        sync: false  # Set manually in dashboard
      - key: DEFAULT_FROM_EMAIL
        sync: false  # Set manually in dashboard

      # Frontend URL (Vercel)
      - key: FRONTEND_URL
        sync: false  # Set to your Vercel URL
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Set to your Vercel URL (comma-separated if multiple)

    # Start command - IMPORTANT: --host 0.0.0.0 is required for Render
    startCommand: |
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      uvicorn backend.asgi:application --host 0.0.0.0 --port $PORT --workers 2 --timeout-keep-alive 120 --log-level info
